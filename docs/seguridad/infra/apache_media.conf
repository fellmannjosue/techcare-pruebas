# docs/seguridad/infra/apache_media.conf
# <--- preparado por claude code (09-nov-2026, revisión ISO 27001). NO APLICADO. Lo aplica TI en una ventana de mantenimiento.
#
# Archivo de destino: /etc/apache2/sites-available/servicios_ana.conf, dentro de <VirtualHost *:437>.
# ANTES de editar:  sudo cp /etc/apache2/sites-available/servicios_ana.conf \
#                         /etc/apache2/sites-available/servicios_ana.conf.bak_$(date +%Y%m%d_%H%M)
# DESPUÉS:          sudo apache2ctl configtest && sudo systemctl reload apache2
#                   (verificar el reinicio por la hora de arranque: ps -eo pid,lstart,cmd | grep "apache2 -k start")
#
# ORDEN OBLIGATORIO: primero desplegar el CÓDIGO de la rama seguridad/iso27001-cobit (las plantillas de
# conducta ya piden las fotos por /conducta/evidencia/<pk>/ver/). Si se cierra /media/evidencias ANTES,
# las miniaturas de evidencia se ven rotas en el dashboard del coordinador y en el historial del maestro.

# ───────────────────────────────────────────────────────────────────────────────
# FASE A (mínima, cierra el hallazgo R01 y R16) — agregar junto a los otros <Directory .../media/...>
# ───────────────────────────────────────────────────────────────────────────────
    # Fotos de evidencia de Conducta (menores): solo por /conducta/evidencia/<pk>/ver/ (con permiso).
    <Directory /home/admin2/techcare_project/system_proyect/media/evidencias>
        Require all denied
    </Directory>

    # Tope de 30 MB por petición (antes ilimitado: un POST enorme llenaba /tmp antes de que Django
    # validara el tamaño). Las subidas más grandes de TechCare son de 20 MB (fotos de mantenimiento).
    LimitRequestBody 31457280

# Verificación de la fase A (desde cualquier equipo, SIN sesión):
#   curl -sk -o /dev/null -w "%{http_code}\n" https://servicios.ana-hn.org:437/media/evidencias/  → 403
#   y con sesión de coordinación BL, abrir un reporte con evidencia: la miniatura debe verse.

# ───────────────────────────────────────────────────────────────────────────────
# FASE B (recomendada, cierra R02: /media/ pasa de LISTA NEGRA a LISTA BLANCA)
# Reemplazar en el bloque existente <Directory .../media>   "Require all granted"   por   "Require all denied"
# (dejando igual Options, php_admin_flag, FilesMatch y Header) y agregar después:
# ───────────────────────────────────────────────────────────────────────────────
    # Lo único que la aplicación enlaza directo por /media/ (verificado el 09-nov-2026 en las plantillas):
    <Directory /home/admin2/techcare_project/system_proyect/media/avatars>
        Require all granted
    </Directory>
    <Directory /home/admin2/techcare_project/system_proyect/media/admin-interface>
        Require all granted
    </Directory>
# Con la fase B, los <Directory>/<LocationMatch> de carpetas concretas quedan redundantes pero NO estorban;
# se pueden dejar. Toda carpeta NUEVA de subidas nacerá cerrada y deberá servirse por una vista con permiso.
#
# Verificación de la fase B:
#   curl -sk -o /dev/null -w "%{http_code}\n" https://servicios.ana-hn.org:437/media/mantenimiento/fotos/  → 403
#   Revisar a mano: foto de perfil (avatar), logo del admin, miniaturas de evidencias, fotos de fichas de
#   mantenimiento, adjuntos de tickets, imágenes de agendas, planos de Red.

# ───────────────────────────────────────────────────────────────────────────────
# REVERSIÓN (cualquiera de las fases)
#   sudo cp /etc/apache2/sites-available/servicios_ana.conf.bak_<fecha> /etc/apache2/sites-available/servicios_ana.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# ───────────────────────────────────────────────────────────────────────────────
