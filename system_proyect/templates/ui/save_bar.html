{# <--- hecho por claude code: barra Guardar/Cancelar uniforme. Params: cancel_url save_label save_icon cancel_label. #}
<div class="tc-save-bar">
  <button type="submit" class="btn btn-primary"><i class="ti {{ save_icon|default:'ti-device-floppy' }} me-1"></i>{{ save_label|default:'Guardar' }}</button>
  {% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-ghost-secondary">{{ cancel_label|default:'Cancelar' }}</a>{% endif %}
</div>
