{# <--- hecho por claude code: tarjeta de navegación (dashboard). Params: href icon color title subtitle (opcional disabled). #}
<a href="{{ href }}" class="tc-tile{% if disabled %} tc-tile--off{% endif %}">
  <span class="tc-tile__icon" style="--tc-tile-color: {{ color|default:'#6366f1' }};">
    <i class="ti {{ icon|default:'ti-square' }}"></i>
  </span>
  <span class="tc-tile__title">{{ title }}</span>
  {% if subtitle %}<span class="tc-tile__sub">{{ subtitle }}</span>{% endif %}
</a>
