<div class="card {{ card_class }}">
  {% if title or actions_slot %}
  <div class="card-header">
    <h3 class="card-title">{% if icon %}<i class="ti {{ icon }} me-2"></i>{% endif %}{{ title }}</h3>

  {% endif %}
  <div class="card-body {{ body_class }}">
