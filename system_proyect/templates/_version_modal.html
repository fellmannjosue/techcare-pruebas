{% load static %}
{# <--- hecho por claude code: modal de novedades (lo incluye _footer.html) #}
{% if novedades %}
<div class="modal modal-blur fade" id="tc-novedades-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="ti ti-sparkles me-2 text-yellow"></i>Novedades · v{{ app_version }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        {% for e in novedades %}
        <div class="{% if not forloop.first %}mt-3 pt-3 border-top{% endif %}">
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="badge {% if forloop.first %}bg-green-lt text-green{% else %}bg-secondary-lt text-muted{% endif %}">v{{ e.version }}</span>
            <span class="text-muted small">{{ e.fecha }}</span>
          </div>
          <ul class="mb-0 ps-3 small">
            {% for c in e.cambios %}<li>{{ c }}</li>{% endfor %}
          </ul>
        </div>
        {% endfor %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Entendido</button>
      </div>
    </div>
  </div>
</div>

<div id="tc-novedades-config" hidden
     data-url-visto="{% url 'marcar_version_vista' %}"
     data-mostrar="{% if mostrar_novedades %}1{% else %}0{% endif %}"></div>
<script src="{% static 'js/version_modal.js' %}?v=2"></script>
{% endif %}
