{# <--- hecho por claude code: tarjeta KPI reutilizable del dashboard de desarrollo #}
<div class="col-6 col-sm-4 col-lg-3">
  <div class="card h-100" style="border-left:4px solid {{ color }};">
    <div class="card-body d-flex align-items-center gap-3 py-3">
      <span class="rounded p-2 d-inline-flex" style="background:{{ color }}22;color:{{ color }};">
        <i class="ti {{ icono }} fs-2"></i>
      </span>
      <div>
        <div class="h2 m-0 fw-bold">{{ valor }}</div>
        <div class="text-muted small">{{ etiqueta }}</div>
      </div>
    </div>
  </div>
</div>
