<form id="form-edit-computadora">
    {% csrf_token %}
    <input type="hidden" id="computadora-id" name="id" value="{{ obj.id }}">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label fw-semibold">Asset ID</label>
            <input type="text" name="asset_id" class="form-control" value="{{ obj.asset_id }}">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.modelo.label }}</label>
            {{ form.modelo }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Serie</label>
            <input type="text" name="serie" class="form-control" value="{{ obj.serie }}" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">IP</label>
            <input type="text" name="ip" class="form-control" value="{{ obj.ip }}"
                   placeholder="{% if 'LABBL' in obj.asset_id %}192.168.12.{% elif 'LABCOL' in obj.asset_id %}192.168.13.{% elif 'CFP' in obj.asset_id %}192.168.19.{% else %}192.168.10.{% endif %}xxx">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.asignado_a.label }}</label>
            {{ form.asignado_a }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.area.label }}</label>
            {{ form.area }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.grado.label }}</label>
            {{ form.grado }}
        </div>

        <div class="col-md-6{% if not grado_subtipo %} d-none{% endif %}" id="edit-campo-grado-subtipo">
            <label class="form-label fw-semibold">Sub-tipo</label>
            <select name="grado_subtipo" class="form-select" id="edit-id-grado-subtipo">
              <option value="">— Seleccionar —</option>
              {% for st in subtipos_otros %}
              <option value="{{ st.nombre }}"{% if grado_subtipo == st.nombre %} selected{% endif %}>{{ st.nombre }}</option>
              {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.fecha_instalado.label }}</label>
            <input type="date" name="fecha_instalado" class="form-control"
                   value="{{ obj.fecha_instalado|date:'Y-m-d' }}">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Edificio</label>
            <select name="edificio" class="form-select">
              <option value="">— Sin edificio —</option>
              {% for e in edificios %}
              <option value="{{ e.nombre }}" {% if e.nombre == obj.edificio %}selected{% endif %}>{{ e.nombre }}</option>
              {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.category.label }}</label>
            {{ form.category }}
        </div>

        <div class="col-12">
            <label class="form-label fw-semibold">{{ form.observaciones.label }}</label>
            {{ form.observaciones }}
        </div>

    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="ti ti-device-floppy me-1"></i> Guardar Cambios
    </button>
</form>
{% load static %}
<script src="{% static 'inventario/js/edit_computadora.js' %}"></script>
