<form id="form-edit-monitor">
    {% csrf_token %}
    <input type="hidden" id="monitor-id" name="id" value="{{ obj.id }}">

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label fw-semibold">Asset ID</label>
            <input type="text" class="form-control bg-light text-muted" value="{{ obj.asset_id }}" readonly>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.modelo.label }}</label>
            {{ form.modelo }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.serie.label }}</label>
            {{ form.serie }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.ubicacion_tipo.label }}</label>
            {{ form.ubicacion_tipo }}
        </div>

        <div class="col-md-6" id="edit-campo-laboratorio">
            <label class="form-label fw-semibold">{{ form.laboratorio.label }}</label>
            {{ form.laboratorio }}
        </div>

        <div class="col-md-6" id="edit-campo-asignado">
            <label class="form-label fw-semibold">{{ form.asignado_a.label }}</label>
            {{ form.asignado_a }}
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ form.category.label }}</label>
            {{ form.category }}
        </div>

        <div class="col-12">
            <label class="form-label fw-semibold">{{ form.observaciones.label }}</label>
            {{ form.observaciones }}
        </div>

    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="ti ti-device-floppy me-1"></i> Guardar Cambios
    </button>
</form>

<script>
(function () {
    function toggleCamposEdit() {
        var val = document.getElementById('id_ubicacion_tipo').value;
        var labDiv = document.getElementById('edit-campo-laboratorio');
        var asnDiv = document.getElementById('edit-campo-asignado');
        var labInput = document.querySelector('#edit-campo-laboratorio input');
        var asnInput = document.querySelector('#edit-campo-asignado input');

        if (val === 'laboratorio') {
            labDiv.style.display = '';
            asnDiv.style.display = 'none';
            if (labInput) labInput.disabled = false;
            if (asnInput) { asnInput.disabled = true; asnInput.value = ''; }
        } else if (val === 'persona') {
            labDiv.style.display = 'none';
            asnDiv.style.display = '';
            if (asnInput) asnInput.disabled = false;
            if (labInput) { labInput.disabled = true; labInput.value = ''; }
        } else {
            labDiv.style.display = 'none';
            asnDiv.style.display = 'none';
            if (labInput) { labInput.disabled = true; labInput.value = ''; }
            if (asnInput) { asnInput.disabled = true; asnInput.value = ''; }
        }
    }

    var sel = document.getElementById('id_ubicacion_tipo');
    if (sel) {
        sel.addEventListener('change', toggleCamposEdit);
        toggleCamposEdit();
    }
})();
</script>
