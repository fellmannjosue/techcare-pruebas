{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta de Inventario</title>
<link rel="stylesheet" href="{% static 'inventario/css/item_pdf_template.css' %}?v=1">
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="{% static 'inventario/img/ana-transformed.png' %}" alt="Logo">
        </div>
        <h2>Tarjeta de Inventario</h2>
        <div class="details">
            <p><strong>ID:</strong> {{ item.id }}</p>
            <p><strong>Categoría:</strong> {{ item.category }}</p>
            <p><strong>Detalles:</strong> {{ item.details }}</p>
            <p><strong>Fecha:</strong> {{ item.created_at }}</p>
        </div>
    </div>
</body>
</html>
