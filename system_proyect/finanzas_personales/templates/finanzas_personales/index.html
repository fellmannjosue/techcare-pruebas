{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger — Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'finanzas_personales/css/app.css' %}?v=15">
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"><i class="ti ti-wallet"></i></div>
      <div><div class="t1">Ledger</div><div class="t2">Finanzas</div></div>
    </div>
    <nav class="nav" id="nav">
      <a data-go="dashboard" class="active"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></a>
      <a data-go="movements"><i class="ti ti-arrows-exchange"></i><span>Movimientos</span></a>
      <a data-go="accounts"><i class="ti ti-wallet"></i><span>Cuentas</span></a>
      <div class="grp">Planificación</div>
      <a data-go="recurrents"><i class="ti ti-rotate-clockwise"></i><span>Recurrentes</span></a>
      <a data-go="pendings"><i class="ti ti-clock-hour-4"></i><span>Pendientes</span></a>
      <a data-go="budgets"><i class="ti ti-chart-pie"></i><span>Presupuestos</span></a>
      <a data-go="goals"><i class="ti ti-target"></i><span>Metas de Ahorro</span></a>
      <div class="grp">Más</div>
      <a onclick="openImport()" style="cursor:pointer"><i class="ti ti-file-import"></i><span>Importar banco</span></a>
      <a data-go="reports"><i class="ti ti-file-analytics"></i><span>Reportes</span></a>
      <a data-go="categories"><i class="ti ti-tags"></i><span>Categorías</span></a>
      <a data-go="settings"><i class="ti ti-settings"></i><span>Configuración</span></a>
    </nav>
    <div class="foot"><a href="/"><i class="ti ti-arrow-left"></i> Salir del módulo</a></div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <header class="topbar">
      <button class="iconbtn mtoggle" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
      <div><div class="ttl" id="pageTitle">Dashboard</div><div class="sub" id="pageSub">Resumen financiero</div></div>
      <div class="sp"></div>
      <button class="iconbtn" onclick="toggleTheme()" title="Tema"><i class="ti ti-moon" id="themeIcon"></i></button>
      <button class="iconbtn" onclick="openTxn()" title="Nuevo movimiento"><i class="ti ti-plus"></i></button>
    </header>

    <main class="content">
      <section id="sec-dashboard"  class="section active"></section>
      <section id="sec-movements"  class="section"></section>
      <section id="sec-accounts"   class="section"></section>
      <section id="sec-recurrents" class="section"></section>
      <section id="sec-pendings"   class="section"></section>
      <section id="sec-budgets"    class="section"></section>
      <section id="sec-goals"      class="section"></section>
      <section id="sec-reports"    class="section"></section>
      <section id="sec-categories" class="section"></section>
      <section id="sec-settings"   class="section"></section>
    </main>
  </div>
</div>

<button class="fab" onclick="openTxn()" title="Nuevo movimiento"><i class="ti ti-plus"></i></button>

<!-- generic modal -->
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mh"><h3 id="mTitle">Título</h3><button class="tbtn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="mb" id="mBody"></div>
    <div class="mf" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.CSRF = "{{ csrf_token }}";</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{% static 'finanzas_personales/js/app.js' %}?v=15"></script>
</body>
</html>
