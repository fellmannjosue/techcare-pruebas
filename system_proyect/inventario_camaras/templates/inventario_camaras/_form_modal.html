{# <--- hecho por claude code: Modal genérico reutilizable para alta/edición; crud.js rellena los campos al editar #}
<div class="modal modal-blur fade" id="modalForm" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <form id="entityForm" method="post" novalidate>
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="modalFormTitle"><i class="ti ti-plus me-2 text-primary"></i>Nuevo registro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="max-height:72vh;overflow-y:auto;">
          <div class="row g-3">
            {% for field in form %}
            <div class="{% if field.field.widget.input_type == 'textarea' or field.name == 'componentes' or field.name == 'observaciones' %}col-12{% else %}col-md-6{% endif %}">
              <label class="form-label fw-semibold" for="{{ field.id_for_label }}">
                {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
              </label>
              {{ field }}
              {% if field.help_text %}<div class="form-hint small text-muted">{{ field.help_text }}</div>{% endif %}
            </div>
            {% endfor %}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary ms-auto"><i class="ti ti-device-floppy me-1"></i>Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
