{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Descripción de Padrino</title>
    <link rel="stylesheet" href="{% static 'sponsors/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'sponsors/css/form_descr_godfather.css' %}">
</head>
<body>

<div class="container form-container">
    <h2 class="mb-4 text-center">Agregar Descripción de Padrino</h2>


    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <div class="mt-3 text-center">
        <a href="{% url 'sponsors:sponsors_dashboard' %}" class="btn btn-secondary">Volver al Dashboard</a>
    </div>
</div>
  <div class="footer">
    © {{ year }} Soporte Técnico - Asociación Nuevo Amanecer. Todos los derechos reservados.
  </div>

</body>
</html>
