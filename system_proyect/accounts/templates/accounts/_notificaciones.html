{% load static %}
{# <--- hecho por claude code: campanita en el TOPBAR, mismos IDs para notifications.js #}
{% if request.user.is_authenticated %}
<div class="dropdown d-inline-block">
  <a href="#" id="notifDropdownToggle" class="btn btn-ghost-secondary btn-icon position-relative"
     data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" title="Notificaciones">
    <i class="ti ti-bell fs-2"></i>
    <span id="badgeNotificaciones"
          class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill d-none"
          style="font-size:.6rem;">0</span>
  </a>
  <div class="dropdown-menu dropdown-menu-end shadow p-0 tc-notif-menu">
    <div class="dropdown-header border-bottom fw-bold py-2 px-3">
      <i class="ti ti-bell me-1"></i>Notificaciones recientes
    </div>
    <ul id="listaNotificaciones" class="list-unstyled mb-0"></ul>
  </div>
</div>
<audio id="notifSound" src="{% static 'accounts/sound/notification.mp3' %}" preload="auto"></audio>
<script src="{% static 'accounts/js/notifications.js' %}?v=4"></script>
{% endif %}
