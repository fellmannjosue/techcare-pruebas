{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Correo Enviado – TechCare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="{% static 'accounts/img/nuevo.ico' %}" type="image/x-icon"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta19/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>
<body class="auth-bg d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="text-center mb-4">
          <img src="{% static 'accounts/img/ana-transformed.png' %}" alt="Logo"
               style="width:72px;height:72px;object-fit:contain;" class="mb-3">
          <h2 class="text-white fw-bold mb-1">TechCare</h2>
          <p class="text-white-50 small mb-0">Asociación Nuevo Amanecer</p>
        </div>

        <div class="card auth-card">
          <div class="card-body p-4 p-md-5 text-center">
            <div class="avatar avatar-lg bg-success-lt mb-3">
              <i class="ti ti-mail-check text-success" style="font-size:1.8rem;"></i>
            </div>
            <h3 class="card-title mb-2">¡Correo enviado!</h3>
            <p class="text-muted mb-4">
              Hemos enviado las instrucciones para restablecer tu contraseña a tu correo.
              Revisa también tu carpeta de spam.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100">
              <i class="ti ti-arrow-left me-2"></i>Volver al inicio de sesión
            </a>
          </div>
        </div>

        <div class="text-center text-white-50 small mt-4">
          © 2025 Soporte Técnico – Asociación Nuevo Amanecer
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta19/dist/js/tabler.min.js"></script>
</body>
</html>
