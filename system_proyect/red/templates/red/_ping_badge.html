{# <--- hecho por claude code: badge de estado de conectividad #}
{% if e == 'ok' %}<span class="badge bg-green-lt text-green"><i class="ti ti-circle-filled me-1"></i>En línea</span>
{% elif e == 'caido' %}<span class="badge bg-red-lt text-red"><i class="ti ti-circle-filled me-1"></i>Caído</span>
{% else %}<span class="badge bg-secondary-lt text-secondary">Sin probar</span>{% endif %}
