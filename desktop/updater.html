<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'; font-src 'none'">
  <title>Novedades y actualización · TechCare</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#101b30; --panel2:#0d172a; --fg:#e8edf7; --muted:#8498b9; --muted2:#5f7391;
      --marca1:#3b82f6; --marca2:#8b5cf6; --ok:#22c55e; --aviso:#f59e0b; --rojo:#ef4444; --borde:#1b2740; --borde2:#233350;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    body{background:var(--bg); color:var(--fg);
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
      display:flex; flex-direction:column; user-select:none;}

    .hero{
      position:relative; overflow:hidden;
      background:
        radial-gradient(600px 180px at 85% -40%, rgba(139,92,246,.45), transparent 70%),
        linear-gradient(120deg,#132043,#0e1830);
      padding:20px 22px; display:flex; align-items:center; gap:14px; flex:0 0 auto;
      border-bottom:1px solid var(--borde);
    }
    .hero .logo{width:46px;height:46px;border-radius:13px;flex:0 0 auto;
      box-shadow:0 6px 18px rgba(59,130,246,.45);}
    .hero h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;}
    .hero .sub{margin:3px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
    .verpill{font-size:11px;font-weight:700;color:#cfe0ff;background:rgba(59,130,246,.18);
      border:1px solid rgba(59,130,246,.4);border-radius:999px;padding:1px 9px;}

    .upd{margin:16px 18px 0; padding:14px 16px; border:1px solid var(--borde); border-radius:14px;
      background:linear-gradient(180deg,var(--panel),var(--panel2)); flex:0 0 auto;}
    .upd-fila{display:flex;align-items:center;gap:12px;}
    .upd-ico{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      font-size:18px;background:#0b1424;border:1px solid var(--borde2);}
    .upd-txt{font-size:13.5px;line-height:1.4;flex:1;min-width:0;}
    .upd-txt b{color:#fff;}
    .upd-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}
    .barra{height:8px;border-radius:999px;background:#0a1322;border:1px solid var(--borde);overflow:hidden;margin-top:12px;display:none;}
    .barra > i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--marca1),var(--marca2));transition:width .25s ease;}
    .barra.on{display:block;}
    .barra.indeterminada > i{width:35% !important;animation:desliza 1.1s ease-in-out infinite;}
    @keyframes desliza{0%{margin-left:-35%}100%{margin-left:100%}}
    .upd-btns{display:flex;gap:9px;margin-top:12px;}
    .upd-btns.vacio{display:none;}
    button{font:inherit;font-size:12.5px;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;}
    .btn-ppal{background:linear-gradient(135deg,var(--marca1),var(--marca2));color:#fff;font-weight:650;box-shadow:0 6px 16px rgba(79,70,229,.35);}
    .btn-ppal:hover{filter:brightness(1.08);}
    .btn-sec{background:transparent;color:var(--muted);border:1px solid var(--borde2);}
    .btn-sec:hover{color:var(--fg);background:#141f36;}

    .nov-wrap{flex:1 1 auto;overflow-y:auto;padding:18px;min-height:0;}
    .nov-wrap h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin:0 0 12px;}
    .nov-item{padding:12px 0;border-top:1px solid var(--borde);}
    .nov-item:first-of-type{border-top:none;padding-top:0;}
    .nov-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
    .badge{font-size:11px;font-weight:700;border-radius:7px;padding:3px 9px;background:rgba(34,197,94,.16);color:#6ee7a0;border:1px solid rgba(34,197,94,.35);}
    .badge.vieja{background:#141f36;color:var(--muted);border-color:var(--borde2);}
    .nov-fecha{color:var(--muted2);font-size:11px;}
    .nov-item ul{margin:0;padding-left:18px;}
    .nov-item li{font-size:12.5px;line-height:1.55;margin:3px 0;color:#d4deee;}
    .nov-vacio{color:var(--muted);font-size:12.5px;}

    .pie{flex:0 0 auto;padding:13px 18px;border-top:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;}
    .pie small{color:var(--muted2);font-size:11px;}
    .oculto{display:none !important;}
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="gMarca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <symbol id="logoAna" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="url(#gMarca)"/>
      <path d="M9 28h7l3-6 5 12 4-9 3 3h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs></svg>

  <div class="hero">
    <svg class="logo" viewBox="0 0 48 48"><use href="#logoAna"/></svg>
    <div>
      <h1>TechCare Pruebas</h1>
      <div class="sub"><span>Asociación Nuevo Amanecer</span><span class="verpill oculto" id="verPill"></span></div>
    </div>
  </div>

  <div class="upd">
    <div class="upd-fila">
      <span class="upd-ico" id="updIco">🔎</span>
      <div class="upd-txt">
        <span id="updTitulo">Buscando actualizaciones…</span>
        <div class="upd-sub" id="updSub"></div>
      </div>
    </div>
    <div class="barra indeterminada" id="barra"><i id="relleno"></i></div>
    <div class="upd-btns vacio" id="updBtns">
      <button class="btn-ppal oculto" id="btnInstalar">Reiniciar e instalar</button>
      <button class="btn-sec oculto" id="btnReintentar">Buscar de nuevo</button>
    </div>
  </div>

  <div class="nov-wrap">
    <h2>Novedades del sistema</h2>
    <div id="novLista"><div class="nov-vacio">Cargando novedades…</div></div>
  </div>

  <div class="pie">
    <small>Las actualizaciones se instalan solas al abrir la app.</small>
    <button class="btn-sec" id="btnCerrar">Cerrar</button>
  </div>

  <script>
    (function(){
      function $(id){ return document.getElementById(id); }
      var updIco=$('updIco'), updTit=$('updTitulo'), updSub=$('updSub'), barra=$('barra'), relleno=$('relleno');
      var updBtns=$('updBtns'), btnInst=$('btnInstalar'), btnReint=$('btnReintentar'), btnCerr=$('btnCerrar');
      var verPill=$('verPill'), novLista=$('novLista');

      btnInst.addEventListener('click',  function(){ if(window.upd) window.upd.instalar(); });
      btnReint.addEventListener('click', function(){ if(window.upd) window.upd.reintentar(); });
      btnCerr.addEventListener('click',  function(){ if(window.upd) window.upd.despues(); });

      function mostrar(el, si){ el.classList.toggle('oculto', !si); }

      function renderEstado(d){
        if(!d) return;
        var f = d.fase;
        updSub.textContent=''; barra.classList.remove('on'); mostrar(btnInst,false); mostrar(btnReint,false); updBtns.classList.add('vacio');
        if(f === 'buscando'){
          updIco.textContent='🔎'; updTit.textContent='Buscando actualizaciones…'; barra.classList.add('on','indeterminada');
        } else if(f === 'descargando'){
          updIco.textContent='⬇️'; updTit.textContent='Descargando la actualización…';
          barra.classList.add('on');
          if(typeof d.percent==='number' && d.percent>0){
            barra.classList.remove('indeterminada'); relleno.style.width=d.percent+'%';
            updSub.textContent=(d.version?('Versión '+d.version+' · '):'')+d.percent+'%';
          } else { barra.classList.add('indeterminada'); if(d.version) updSub.textContent='Versión '+d.version; }
        } else if(f === 'listo'){
          updIco.textContent='✅'; updTit.innerHTML='Actualización lista. <b>Reinicia para instalarla.</b>';
          if(d.version) updSub.textContent='Versión '+d.version;
          mostrar(btnInst,true); updBtns.classList.remove('vacio');
        } else if(f === 'actual'){
          updIco.textContent='✔️'; updTit.innerHTML='Tienes la <b>última versión</b> instalada.';
          mostrar(btnReint,true); updBtns.classList.remove('vacio');
        } else if(f === 'error'){
          updIco.textContent='⚠️'; updTit.textContent='No se pudo buscar la actualización.';
          updSub.textContent=d.mensaje||'Revisa la conexión con el servidor.';
          mostrar(btnReint,true); updBtns.classList.remove('vacio');
        } else if(f === 'dev'){
          updIco.textContent='ℹ️'; updTit.textContent='El actualizador solo funciona en la app instalada.';
        }
      }

      function renderNovedades(d){
        novLista.textContent='';
        if(!d || !d.ok){
          var v=document.createElement('div'); v.className='nov-vacio';
          v.textContent='No se pudieron cargar las novedades (sin conexión con el servidor).';
          novLista.appendChild(v); return;
        }
        if(d.version){ verPill.textContent='v'+d.version; mostrar(verPill,true); }
        var ent=d.entradas||[];
        if(!ent.length){ var z=document.createElement('div'); z.className='nov-vacio'; z.textContent='Sin novedades registradas.'; novLista.appendChild(z); return; }
        ent.forEach(function(e, idx){
          var item=document.createElement('div'); item.className='nov-item';
          var head=document.createElement('div'); head.className='nov-head';
          var b=document.createElement('span'); b.className='badge'+(idx===0?'':' vieja'); b.textContent='v'+(e.version||''); head.appendChild(b);
          if(e.fecha){ var fe=document.createElement('span'); fe.className='nov-fecha'; fe.textContent=e.fecha; head.appendChild(fe); }
          item.appendChild(head);
          var ul=document.createElement('ul');
          (e.cambios||[]).forEach(function(c){ var li=document.createElement('li'); li.textContent=c; ul.appendChild(li); });
          item.appendChild(ul); novLista.appendChild(item);
        });
      }

      if(window.upd){ window.upd.alCambiar(renderEstado); window.upd.alNovedades(renderNovedades); }
    })();
  </script>
</body>
</html>
