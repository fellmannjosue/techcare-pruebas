<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
  <title>Novedades y actualización · TechCare</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#111c33; --fg:#e7ecf5; --muted:#8aa0c2;
      --marca1:#2563eb; --marca2:#7c3aed; --ok:#16a34a; --borde:#1e2b45;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    body{
      background:var(--bg); color:var(--fg);
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
      display:flex; flex-direction:column; user-select:none;
    }
    .hero{
      background:linear-gradient(120deg,var(--marca1),var(--marca2));
      padding:16px 20px; display:flex; align-items:center; gap:13px; flex:0 0 auto;
    }
    .hero .ico{
      width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);
      display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto;
    }
    .hero h1{font-size:15px;margin:0;font-weight:600;}
    .hero p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.82);}

    /* ── Estado de actualización (compacto) ── */
    .upd{
      margin:14px 16px 0; padding:12px 14px; border:1px solid var(--borde);
      border-radius:12px; background:var(--panel); flex:0 0 auto;
    }
    .upd-fila{display:flex;align-items:center;gap:10px;}
    .upd-ico{font-size:18px;flex:0 0 auto;}
    .upd-txt{font-size:13px;line-height:1.35;flex:1;min-width:0;}
    .upd-txt b{color:#fff;}
    .upd-sub{color:var(--muted);font-size:11px;}
    .barra{height:8px;border-radius:999px;background:var(--borde);overflow:hidden;margin-top:10px;display:none;}
    .barra > i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--marca1),var(--marca2));transition:width .25s ease;}
    .barra.on{display:block;}
    .barra.indeterminada > i{width:35% !important;animation:desliza 1.1s ease-in-out infinite;}
    @keyframes desliza{0%{margin-left:-35%}100%{margin-left:100%}}
    .upd-btns{display:flex;gap:8px;margin-top:10px;}
    .upd-btns.vacio{display:none;}
    button{font:inherit;font-size:12.5px;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;}
    .btn-ppal{background:var(--ok);color:#fff;font-weight:600;}
    .btn-sec{background:transparent;color:var(--muted);border:1px solid var(--borde);}
    .btn-sec:hover{color:var(--fg);}

    /* ── Novedades ── */
    .nov-wrap{flex:1 1 auto;overflow-y:auto;padding:16px;min-height:0;}
    .nov-wrap h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;}
    .nov-item{padding:10px 0;border-top:1px solid var(--borde);}
    .nov-item:first-of-type{border-top:none;padding-top:0;}
    .nov-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
    .badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;background:#14321f;color:#5be08a;}
    .badge.vieja{background:#1b2740;color:var(--muted);}
    .nov-fecha{color:var(--muted);font-size:11px;}
    .nov-item ul{margin:0;padding-left:18px;}
    .nov-item li{font-size:12.5px;line-height:1.5;margin:2px 0;}
    .nov-vacio{color:var(--muted);font-size:12.5px;}

    .pie{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--borde);display:flex;justify-content:flex-end;}
    .oculto{display:none !important;}
  </style>
</head>
<body>
  <div class="hero">
    <div class="ico">✨</div>
    <div>
      <h1 id="heroTitulo">Novedades de TechCare</h1>
      <p id="heroVersion">Asociación Nuevo Amanecer</p>
    </div>
  </div>

  <!-- Estado de la actualización -->
  <div class="upd">
    <div class="upd-fila">
      <span class="upd-ico" id="updIco">🔎</span>
      <div class="upd-txt">
        <span id="updTitulo">Buscando actualizaciones…</span>
        <div class="upd-sub" id="updSub"></div>
      </div>
    </div>
    <div class="barra indeterminada" id="barra"><i id="relleno"></i></div>
    <div class="upd-btns vacio" id="updBtns">
      <button class="btn-ppal oculto" id="btnInstalar">Reiniciar e instalar</button>
      <button class="btn-sec oculto" id="btnReintentar">Buscar de nuevo</button>
    </div>
  </div>

  <!-- Novedades -->
  <div class="nov-wrap">
    <h2>Novedades</h2>
    <div id="novLista"><div class="nov-vacio">Cargando novedades…</div></div>
  </div>

  <div class="pie">
    <button class="btn-sec" id="btnCerrar">Cerrar</button>
  </div>

  <script>
    (function(){
      var updIco  = document.getElementById('updIco');
      var updTit  = document.getElementById('updTitulo');
      var updSub  = document.getElementById('updSub');
      var barra   = document.getElementById('barra');
      var relleno = document.getElementById('relleno');
      var updBtns = document.getElementById('updBtns');
      var btnInst = document.getElementById('btnInstalar');
      var btnReint= document.getElementById('btnReintentar');
      var btnCerr = document.getElementById('btnCerrar');
      var heroVer = document.getElementById('heroVersion');
      var novLista= document.getElementById('novLista');

      btnInst.addEventListener('click',  function(){ if(window.upd) window.upd.instalar(); });
      btnReint.addEventListener('click', function(){ if(window.upd) window.upd.reintentar(); });
      btnCerr.addEventListener('click',  function(){ if(window.upd) window.upd.despues(); });

      function mostrar(el, si){ el.classList.toggle('oculto', !si); }

      // ── Estado de actualización ──
      function renderEstado(d){
        if(!d) return;
        var f = d.fase;
        updSub.textContent = '';
        barra.classList.remove('on');
        mostrar(btnInst, false);
        mostrar(btnReint, false);
        updBtns.classList.add('vacio');

        if(f === 'buscando'){
          updIco.textContent = '🔎';
          updTit.textContent = 'Buscando actualizaciones…';
          barra.classList.add('on','indeterminada');
        } else if(f === 'descargando'){
          updIco.textContent = '⬆️';
          updTit.textContent = 'Descargando la actualización…';
          if(d.version) updSub.textContent = 'Versión ' + d.version;
          barra.classList.add('on');
          if(typeof d.percent === 'number' && d.percent > 0){
            barra.classList.remove('indeterminada');
            relleno.style.width = d.percent + '%';
            updSub.textContent = (d.version ? ('Versión ' + d.version + ' · ') : '') + d.percent + '%';
          } else { barra.classList.add('indeterminada'); }
        } else if(f === 'listo'){
          updIco.textContent = '✅';
          updTit.innerHTML = 'Actualización lista. <b>Reinicia para instalarla.</b>';
          if(d.version) updSub.textContent = 'Versión ' + d.version;
          mostrar(btnInst, true); updBtns.classList.remove('vacio');
        } else if(f === 'actual'){
          updIco.textContent = '✔️';
          updTit.innerHTML = 'Ya tienes la <b>última versión</b>.';
          mostrar(btnReint, true); updBtns.classList.remove('vacio');
        } else if(f === 'error'){
          updIco.textContent = '⚠️';
          updTit.textContent = 'No se pudo buscar la actualización.';
          updSub.textContent = d.mensaje || 'Revisa la conexión con el servidor.';
          mostrar(btnReint, true); updBtns.classList.remove('vacio');
        } else if(f === 'dev'){
          updIco.textContent = 'ℹ️';
          updTit.textContent = 'El actualizador solo funciona en la app instalada.';
        }
      }

      // ── Novedades ──
      function renderNovedades(d){
        novLista.textContent = '';
        if(!d || !d.ok){
          var v = document.createElement('div');
          v.className = 'nov-vacio';
          v.textContent = 'No se pudieron cargar las novedades (sin conexión con el servidor).';
          novLista.appendChild(v);
          return;
        }
        if(d.version) heroVer.textContent = 'Versión ' + d.version;
        var ent = d.entradas || [];
        if(!ent.length){
          var z = document.createElement('div');
          z.className = 'nov-vacio'; z.textContent = 'Sin novedades registradas.';
          novLista.appendChild(z); return;
        }
        ent.forEach(function(e, idx){
          var item = document.createElement('div'); item.className = 'nov-item';
          var head = document.createElement('div'); head.className = 'nov-head';
          var b = document.createElement('span');
          b.className = 'badge' + (idx === 0 ? '' : ' vieja');
          b.textContent = 'v' + (e.version || '');
          head.appendChild(b);
          if(e.fecha){
            var fe = document.createElement('span'); fe.className = 'nov-fecha';
            fe.textContent = e.fecha; head.appendChild(fe);
          }
          item.appendChild(head);
          var ul = document.createElement('ul');
          (e.cambios || []).forEach(function(c){
            var li = document.createElement('li'); li.textContent = c; ul.appendChild(li);
          });
          item.appendChild(ul);
          novLista.appendChild(item);
        });
      }

      if(window.upd){
        window.upd.alCambiar(renderEstado);
        window.upd.alNovedades(renderNovedades);
      }
    })();
  </script>
</body>
</html>
