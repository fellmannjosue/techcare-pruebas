name: Build Desktop (Windows)

# Compila el instalador de Windows de la app de escritorio (carpeta /desktop).
# Se dispara a mano (Run workflow) o al empujar un tag "desktop-v*".
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador (.exe)
        run: npm run build

      # Se suben el/los instalador(es) + latest.yml + *.blockmap:
      # electron-updater necesita latest.yml y el .blockmap del NSIS para el auto-update.
      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TechCare-Pruebas-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Publicar Release (solo en tags desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
