name: Build Mobile (Android APK)

# Compila el APK beta de Android (carpeta /mobile) y crea/actualiza el Release.
# Es un envoltorio WebView que abre la web de pruebas (LAN). APK de DEPURACIÓN
# (instalable por sideload; sin Google Play). Se dispara:
#   - al empujar cambios dentro de mobile/ a main (automático),
#   - a mano (Run workflow),
#   - o al empujar un tag "mobile-v*".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generar Gradle wrapper (8.7)
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK (debug, instalable)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Leer versión
        id: ver
        run: |
          v=$(grep versionName app/build.gradle | head -1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "TechCare-Pruebas-${{ steps.ver.outputs.v }}.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TechCare-Pruebas-Android
          path: mobile/TechCare-Pruebas-*.apk
          if-no-files-found: error

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.ver.outputs.v }}
          name: TechCare Pruebas APK v${{ steps.ver.outputs.v }}
          files: mobile/TechCare-Pruebas-*.apk
