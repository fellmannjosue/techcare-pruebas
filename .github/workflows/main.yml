name: Build Desktop (Windows)

# Compila el instalador de Windows de la app de escritorio (carpeta /desktop) y
# crea/actualiza el Release automáticamente con la versión de desktop/package.json.
# Se dispara:
#   - solo al empujar cambios dentro de desktop/ a main (automático),
#   - a mano (Run workflow),
#   - o al empujar un tag "desktop-v*".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador (.exe)
        run: npm run build

      # Lee la versión de desktop/package.json para nombrar el tag/Release.
      - name: Leer versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TechCare-Pruebas-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      # Crea (o actualiza) el Release desktop-v<versión> con los binarios. Automático.
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.v }}
          name: TechCare Pruebas v${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
