<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fb; color: #1f2937; padding: 24px; text-align: center;
  }
  .box { max-width: 420px; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .25rem 0; color: #4b5563; line-height: 1.5; }
  .pill { display:inline-block; margin-top:1rem; padding:.55rem 1.1rem; border-radius:999px;
          background:#2563eb; color:#fff; font-weight:600; text-decoration:none; }
  code { background:#e5e7eb; padding:.1rem .35rem; border-radius:4px; }
</style>
</head>
<body>
  <div class="box">
    <h1>No se pudo conectar</h1>
    <p>La app de pruebas solo funciona dentro del <strong>WiFi de ANA</strong>.</p>
    <p>Verifica que estés conectado a la red y que el servidor
       <code>192.168.10.6:451</code> esté encendido.</p>
    <a class="pill" href="javascript:location.reload()">Reintentar</a>
  </div>
</body>
</html>
