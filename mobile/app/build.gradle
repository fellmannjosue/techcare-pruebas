plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ana.techcare'
    compileSdk 34

    defaultConfig {
        applicationId "org.ana.techcare.pruebas"
        minSdk 24
        targetSdk 34
        // <--- hecho por claude code: versión sincronizada con la web/.exe (beta).
        versionCode 80001
        versionName "7.80.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
